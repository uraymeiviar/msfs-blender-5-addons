<svg xmlns="http://www.w3.org/2000/svg" width="680" height="690" viewBox="0 0 680 690" role="img" font-family="Segoe UI, Arial, sans-serif">
  <title>Zones, seams, visibility and packing</title>
  <desc>Seams, from Auto Seam or by hand, and the unwrap produce the UV islands. Visibility is stored per face; each island's visibility comes from its seen faces. The scene's density freedom times the density marks from the root down to the object (the zone empty's mark included) times the island visibility gives a density ratio range without unit. That ratio times the target density gives the island's density range in pixels per centimetre. The zone also decides the texture set; the packer packs one texture set per zone and class, each island inside its range.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="690" fill="#FFFFFF"/>
  <g dominant-baseline="central" text-anchor="middle">
    <rect x="40" y="30" width="135" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
    <text x="107" y="48" font-size="14" font-weight="600" fill="#085041">Zone</text>
    <text x="107" y="68" font-size="12" fill="#0F6E56">Mark on its empty</text>
    <rect x="195" y="30" width="135" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
    <text x="262" y="48" font-size="14" font-weight="600" fill="#444441">Density marks</text>
    <text x="262" y="68" font-size="12" fill="#5F5E5A">Root to object</text>
    <rect x="350" y="30" width="135" height="56" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.75"/>
    <text x="417" y="48" font-size="14" font-weight="600" fill="#72243E">Visibility</text>
    <text x="417" y="68" font-size="12" fill="#993556">Stored per face</text>
    <rect x="505" y="30" width="135" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
    <text x="572" y="48" font-size="14" font-weight="600" fill="#3C3489">Seams</text>
    <text x="572" y="68" font-size="12" fill="#534AB7">Auto Seam, by hand</text>
    <line x1="572" y1="86" x2="572" y2="118" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="505" y="120" width="135" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
    <text x="572" y="138" font-size="14" font-weight="600" fill="#3C3489">UV islands</text>
    <text x="572" y="158" font-size="12" fill="#534AB7">After the unwrap</text>
    <line x1="417" y1="86" x2="417" y2="208" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M572 176 L572 238 L494 238" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="342" y="210" width="150" height="56" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.75"/>
    <text x="417" y="228" font-size="14" font-weight="600" fill="#72243E">Island visibility</text>
    <text x="417" y="248" font-size="12" fill="#993556">From its seen faces</text>
    <line x1="120" y1="86" x2="220" y2="308" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="262" y1="86" x2="290" y2="308" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="410" y1="266" x2="390" y2="308" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="140" y="310" width="400" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
    <text x="340" y="328" font-size="14" font-weight="600" fill="#2C2C2A">Density ratio range</text>
    <text x="340" y="348" font-size="12" fill="#5F5E5A">freedom × marks × island visibility, no unit</text>
    <line x1="310" y1="366" x2="310" y2="408" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="140" y="410" width="340" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
    <text x="310" y="428" font-size="14" font-weight="600" fill="#2C2C2A">Island density range</text>
    <text x="310" y="448" font-size="12" fill="#5F5E5A">ratio × target, pixels per cm</text>
    <rect x="505" y="410" width="135" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
    <text x="572" y="428" font-size="14" font-weight="600" fill="#444441">Target density</text>
    <text x="572" y="448" font-size="12" fill="#5F5E5A">Pixels per cm</text>
    <line x1="505" y1="438" x2="482" y2="438" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="310" y1="466" x2="310" y2="498" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M60 86 L60 528 L138 528" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="70" y="476" font-size="12" fill="#5F5E5A" text-anchor="start">texture</text>
    <text x="70" y="492" font-size="12" fill="#5F5E5A" text-anchor="start">set</text>
    <rect x="140" y="500" width="400" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
    <text x="340" y="518" font-size="14" font-weight="600" fill="#444441">Packer</text>
    <text x="340" y="538" font-size="12" fill="#5F5E5A">One texture set per zone and class</text>
    <line x1="340" y1="556" x2="340" y2="588" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="190" y="590" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
    <text x="340" y="608" font-size="14" font-weight="600" fill="#085041">Packed UVs</text>
    <text x="340" y="628" font-size="12" fill="#0F6E56">Each island inside its range</text>
  </g>
</svg>
